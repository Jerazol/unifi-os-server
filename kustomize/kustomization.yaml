apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unifi

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# The image extracted from Ubiquiti's installer with ../extract-image.sh and pushed to your registry.
# Pin it by the digest the script prints.
images:
  - name: uosserver
    newName: registry.example.com/uosserver
    newTag: "5.1.42"
    # digest: sha256:...

# APP_VERSION and UOS_UUID, see config.env
configMapGenerator:
  - name: unifi-os-server
    envs:
      - config.env
